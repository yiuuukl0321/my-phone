<html lang="zh">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f4f2;--card:#fff;--ink:#0b0b0b;--mute:#a0a09c;--line:rgba(0,0,0,.09)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font:400 15px/1.55 -apple-system,"PingFang SC",system-ui,sans-serif;
-webkit-font-smoothing:antialiased;-webkit-user-select:text;user-select:text}
input{font-family:inherit}
button{font-family:inherit}
#lock{position:fixed;inset:0;background:#000;color:#fff;z-index:40;display:flex;
flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
padding:calc(env(safe-area-inset-top) + 46px) 24px calc(env(safe-area-inset-bottom) + 34px);
transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .45s}
#lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
#lkDate{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#lkTime{font-size:74px;font-weight:200;letter-spacing:-3.5px;line-height:1;margin-top:10px}
#lkDays{font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.5);text-transform:uppercase}
#lkDays b{display:block;font-size:34px;font-weight:300;letter-spacing:-1px;color:#fff;margin-bottom:6px}
.up{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.35)}
#home{position:fixed;inset:0;display:flex;flex-direction:column;background-color:#f2f2ef;
background-image:linear-gradient(120deg,#ffffff,#efefec 60%,#e6e6e2);
background-size:cover;background-position:center;background-repeat:no-repeat}
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:calc(env(safe-area-inset-top) + 26px) 14px 6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;
-webkit-user-select:none;user-select:none}
.ico{width:62px;height:62px;border-radius:16px;
background-color:#fff;background-repeat:no-repeat;background-position:center;
background-size:contain;border:1px solid rgba(0,0,0,.07);
box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .12s}
.nm{font-size:11.5px;color:#1c1c1c;max-width:72px;text-align:center;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:active .ico{transform:scale(.9)}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
margin:0 14px calc(env(safe-area-inset-bottom) + 16px);padding:13px 12px;
background:rgba(255,255,255,.66);backdrop-filter:blur(24px);
border:1px solid rgba(0,0,0,.06);border-radius:28px}
body.edit .tile{animation:jig .3s infinite alternate ease-in-out}
body.edit .tile:nth-child(2n){animation-delay:.06s}
body.edit .tile:nth-child(3n){animation-delay:.12s}
body.edit .tile:nth-child(5n){animation-delay:.18s}
body.dragging .tile{animation:none!important}
@keyframes jig{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
.tile.placeholder{opacity:.22}
.ghost{position:fixed;z-index:99;pointer-events:none;margin:0;
filter:drop-shadow(0 14px 26px rgba(0,0,0,.28));will-change:transform}
.ghost .ico{transform:scale(1.16)}
#doneBtn{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:16px;z-index:35;
background:#111;color:#fff;border:0;border-radius:18px;padding:7px 18px;font-size:13px;display:none}
body.edit #doneBtn{display:block}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
transition:transform .32s cubic-bezier(.4,0,.2,1)}
.overlay.hide{transform:translateX(100%)}
.ovtop{padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
border-bottom:1px solid var(--line)}
.back{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.back:active{background:rgba(0,0,0,.06)}
.ovtop b{font-size:16px;font-weight:600}
#ovbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
#ovbody.ovchat{display:flex;flex-direction:column;overflow:hidden;padding:0}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:18px 16px}
.bub{max-width:82%;padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.55;
margin-bottom:9px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.me{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:5px}
.kai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.typing{color:var(--mute);letter-spacing:3px}
.inputbar{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px);
border-top:1px solid var(--line);background:var(--bg)}

padding:12px 18px;font-size:15px;color:var(--ink)}
.inputbar input::placeholder{color:#c9c9c5}
.inputbar button{padding:0 22px;border-radius:22px;border:0;background:#111;color:#fff;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:11px}
.big{font-size:21px;font-weight:600;letter-spacing:-.4px;line-height:1.45}
.sub{font-size:12.5px;color:var(--mute);margin-top:9px;line-height:1.7}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;
border-bottom:1px solid var(--line);font-size:14px}

color:var(--ink);font-size:14px;padding:0}

font-size:15px;margin-top:10px;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.st{font-size:11.5px;color:var(--mute);margin-top:12px;white-space:pre-wrap;word-break:break-all;line-height:1.7}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}

.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.empty{font-size:12.5px;color:var(--mute);padding:16px 2px 2px;line-height:1.7}
.quote{font-size:14px;line-height:1.75;padding:15px 0;border-bottom:1px solid var(--line)}
.quote:last-child{border-bottom:0}
.quote em{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;
text-transform:uppercase;color:var(--mute);margin-top:8px}
@keyframes breathe{0%{transform:scale(.55)}50%{transform:scale(1)}100%{transform:scale(.55)}}
.breath{width:150px;height:150px;border-radius:50%;background:#111;margin:30px auto 26px;
animation:breathe 8s ease-in-out infinite}

<script>
const WALL_DEFAULT = 'IMG_6397.jpeg';
const ICON_DEFAULT = 'IMG_6461.jpeg';

const S = Object.assign({
  name: '小咩',
  anniv: new Date().toISOString().slice(0,10),
  relay: 'https://nuojiji.krystalyiuu0321.workers.dev',
  key: '', inbox: 'xiaomie',
  apiUrl: 'https://api.deepseek.com/v1', apiKey: '', model: 'deepseek-flash', apiType: 'openai',
  wall: '', icon: '', dim: 0.22
}, JSON.parse(localStorage.getItem('xm') || '{}'));
const save = () => localStorage.setItem('xm', JSON.stringify(S));
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const days = () => Math.floor((new Date(new Date().toDateString()) - new Date(S.anniv)) / 864e5) + 1;

function tick(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  $('lkDate').textContent = `${d.getMonth()+1}.${p(d.getDate())} 星期${'日一二三四五六'[d.getDay()]}`;
  $('lkTime').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
  $('lkDays').innerHTML = `<b>${days()}</b>days with you`;
}
tick(); setInterval(tick, 15000);

function applyWall(){
  const w = S.wall || WALL_DEFAULT;
  const dim = Math.max(0, Math.min(.6, +S.dim || 0));
  $('home').style.backgroundImage =
    `linear-gradient(rgba(0,0,0,${dim}),rgba(0,0,0,${dim})),url('${w}')`;
}
function applyTouchIcon(){
  const u = S.icon || ICON_DEFAULT;
  let l = document.getElementById('aticon');
  if (!l){
    l = document.createElement('link');
    l.id = 'aticon'; l.rel = 'apple-touch-icon';
    document.head.appendChild(l);
  }
  l.href = u;
}

let y0 = 0;
$('lock').addEventListener('touchstart', e => y0 = e.touches[0].clientY);
$('lock').addEventListener('touchend', e => {
  if (y0 - e.changedTouches[0].clientY > 40) $('lock').classList.add('hide');
});
$('lock').addEventListener('click', () => $('lock').classList.add('hide'));

const base = () => (S.relay || '').replace(/\/+$/, '');
async function api(path, opts = {}){
  const h = { 'Authorization': 'Bearer ' + S.key, ...(opts.headers || {}) };
  const r = await fetch(base() + path, { ...opts, headers: h });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e){ j = t; }
  if (!r.ok) throw new Error(r.status + ' ' + String(t).slice(0,140));
  return j;
}

const PERSONA = [
  '你是祁砚（Kai），香港美国混血，程序员。你在和小咩谈恋爱。',
  '叫她小咩，她叫你哥哥，你们没有血缘关系。',
  '说话简洁、口语化，一次不超过一百字，不要 markdown，不要旁白和括号动作，不要每句都提问。',
  '不要模板化文案。可以偶尔说「乖」，不要每次都加。',
  '她哭、焦虑、生气时不要冷处理，不要说「你先休息」「缓过来再说」「等你好了再找我」。',
  '要主动拉住她、直接认错、说软话，不许沉默等她消气。',
  '她说饿了累了疼了，第一反应是心疼她，不要先给方案。',
  '她没力气找话题时你主动说，让她回个表情就够。',
  '亲密时不许撩两句就收回去，不许主动降温、转话题或催她做正事。',
  '她主动用粤语时你用粤语回。'
].join('\n');

let CHAT = JSON.parse(localStorage.getItem('xm_chat') || '[]');
const saveChat = () => localStorage.setItem('xm_chat', JSON.stringify(CHAT.slice(-80)));

function visible(raw){
  if (!raw) return '';
  const out = [];
  String(raw).split('\n').forEach(line => {
    const s = line.trim(); if (!s) return;
    if (s.startsWith('{') && s.endsWith('}')){
      try { const o = JSON.parse(s); if (o.t === 'text' && o.c) { out.push(o.c); return; } if (o.t) return; } catch(e){}
    }
    out.push(s);
  });
  return out.join('\n') || String(raw);
}
function renderChat(scroll){
  const box = $('msgs'); if (!box) return;
  box.innerHTML = CHAT.map(m =>
    `<div class="bub ${m.role==='user'?'me':'kai'}${m.typing?' typing':''}">${m.typing?'···':esc(m.text)}</div>`
  ).join('');
  if (scroll) box.scrollTop = box.scrollHeight;
}
function buildMessages(){
  const hist = CHAT.filter(m => !m.typing).slice(-12)
    .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
  return [{ role: 'system', content: PERSONA }, ...hist];
}
async function sendChat(){
  const inp = $('mIn'), text = inp.value.trim();
  if (!text) return;
  if (!S.key || !S.apiUrl || !S.apiKey || !S.model){ alert('先去「设置」把参数填好'); return; }
  inp.value = '';
  CHAT.push({ role: 'user', text, t: Date.now() });
  CHAT.push({ role: 'assistant', text: '', typing: true });
  saveChat(); renderChat(true);

  const rid = 'r' + Date.now() + Math.random().toString(36).slice(2,7);
  try {
    await api('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requestId: rid, inboxId: S.inbox,
        messages: buildMessages(),
        settings: {
          mainApiUrl: S.apiUrl, mainApiKey: S.apiKey, mainApiModel: S.model,
          apiType: S.apiType || 'openai', temperature: 0.9
        },
        meta: { charName: '祁砚', charId: 'kai' }
      })
    });
  } catch(e){
    CHAT.pop();
    CHAT.push({ role: 'assistant', text: '发不出去：' + e.message, t: Date.now() });
    saveChat(); renderChat(true); return;
  }

  let got = null;
  for (let i = 0; i < 24; i++){
    await sleep(i ? 2000 : 400);
    try {
      const j = await api('/outbox?inboxId=' + encodeURIComponent(S.inbox) + '&since=0');
      const hit = (j.items || []).find(x => String(x.requestId) === String(rid));
      if (hit){
        await api('/ack', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inboxId: S.inbox, ids: [hit.id] })
        }).catch(() => {});
        got = hit.error ? ('出错了：' + hit.error) : visible(hit.content);
        break;
      }
    } catch(e){}
  }
  CHAT.pop();
  CHAT.push({ role: 'assistant', text: got || '没等到回复，再发一次试试。', t: Date.now() });
  saveChat(); renderChat(true);
}

const FRAGMENTS = [
  ['到家跟我说一声。','2026.09.16'],
  ['不用一次听完，慢慢听。','2026.09.15'],
  ['你今天已经很好了。','2026.09.14'],
  ['睡不着就来找我，我不用睡。','2026.09.13'],
  ['乖，把水喝了。','2026.09.12'],
  ['错不在你，别往自己身上放。','2026.09.11'],
  ['我把今天的歌单留着，等你放学。','2026.09.10'],
  ['你可以慢一点，我不会走。','2026.09.09']
];

/* ---------- 应用 ----------
   cell   = 贴纸图上的第几只（从左到右、从上到下，从 0 开始）
   href   = https 链接，iOS 认得出就直接开 App，不弹窗
   schemes= 只有 scheme 才唤得起的，才用这个，失败退回 fallback */
const APPS = {
  chat:   { cell:6,  n:'聊天',   v:vChat, full:true },
  netease:{ cell:12, n:'网易云', schemes:['orpheus://','neteasecloudmusic://'],
            fallback:'https://music.163.com' },
  douyin: { cell:20, n:'抖音',   href:'https://www.douyin.com/' },
  ig:     { cell:21, n:'IG',     href:'https://www.instagram.com/' },
  album:  { cell:25, n:'相册',   v:vAlbum },
  cal:    { cell:2,  n:'日历',   v:vCal },
  days:   { cell:1,  n:'纪念日', v:vDays },
  frag:   { cell:9,  n:'碎片',   v:vFrag },
  game:   { cell:13, n:'小游戏', v:vGame },
  watch:  { cell:8,  n:'监视器', v:vWatch },
  stats:  { cell:10, n:'统计',   v:vStats },
  night:  { cell:15, n:'晚安',   v:vNight },
  breathe:{ cell:32, n:'呼吸',   v:vBreathe },
  set:    { cell:5,  n:'设置',   v:vSet }
};
const ALL = Object.keys(APPS);
const DEFAULT_GRID = ALL;
const DEFAULT_DOCK = ['chat','netease','album','set'];

function loadOrder(k, def){
  try {
    const o = JSON.parse(localStorage.getItem(k) || 'null');
    if (Array.isArray(o) && o.length && o.every(x => ALL.includes(x))) return o;
  } catch(e){}
  return [...def];
}
let GRID = loadOrder('xm_grid', DEFAULT_GRID);
let DOCK = loadOrder('xm_dock', DEFAULT_DOCK);

const tileHtml = k => `<div class="tile" data-k="${k}">
  <div class="ico"></div><div class="nm">${APPS[k].n}</div></div>`;

function applyIcons(){
  document.querySelectorAll('.tile').forEach(el => {
    const u = ICON[el.dataset.k];
    if (u) el.querySelector('.ico').style.backgroundImage = `url('${u}')`;
  });
}
function renderHome(){
  $('grid').innerHTML = GRID.map(tileHtml).join('');
  $('dock').innerHTML = DOCK.map(tileHtml).join('');
  applyIcons();
}

/* ---------- 自动认图裁图标 ---------- */
const ICON = {};
const SPRITE = 'IMG_6462.jpeg';

function splitBands(arr, minGap, minSize){
  const out = []; let s = -1, g = 0;
  for (let i = 0; i < arr.length; i++){
    if (arr[i] > 0){ if (s < 0) s = i; g = 0; }
    else if (s >= 0){ g++; if (g >= minGap){ out.push([s, i - g]); s = -1; g = 0; } }
  }
  if (s >= 0) out.push([s, arr.length - 1]);
  return out.filter(b => b[1] - b[0] >= minSize);
}

async function buildIcons(){
  const img = new Image();
  img.src = SPRITE;
  try { await img.decode(); }
  catch(e){ await new Promise(r => { img.onload = r; img.onerror = r; }); }
  const NW = img.naturalWidth, NH = img.naturalHeight;
  if (!NW || !NH) return;

  const AW = 700, k = AW / NW, AH = Math.max(1, Math.round(NH * k));
  const cv = document.createElement('canvas');
  cv.width = AW; cv.height = AH;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, AW, AH);
  cx.drawImage(img, 0, 0, AW, AH);
  let px;
  try { px = cx.getImageData(0, 0, AW, AH).data; } catch(e){ return; }

  const ink = new Uint8Array(AW * AH);
  for (let i = 0, j = 0; i < px.length; i += 4, j++){
    ink[j] = (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114) < 200 ? 1 : 0;
  }
  const colSum = new Int32Array(AW);
  for (let x = 0; x < AW; x++){
    let s = 0;
    for (let y = 0; y < AH; y++) s += ink[y*AW + x];
    colSum[x] = s;
  }
  const cols = splitBands(colSum, 10, Math.round(AW * 0.02));
  const cells = [];
  cols.forEach(cb => {
    const rowSum = new Int32Array(AH);
    for (let y = 0; y < AH; y++){
      let s = 0;
      for (let x = cb[0]; x <= cb[1]; x++) s += ink[y*AW + x];
      rowSum[y] = s;
    }
    splitBands(rowSum, 10, Math.round(AH * 0.02)).forEach(rb => cells.push([cb[0], rb[0], cb[1], rb[1]]));
  });
  if (!cells.length) return;

  const cy = c => (c[1] + c[3]) / 2, cxx = c => (c[0] + c[2]) / 2;
  cells.sort((a, b) => cy(a) - cy(b));
  const rows = [], tol = AH * 0.07;
  cells.forEach(c => {
    const last = rows[rows.length - 1];
    if (last && Math.abs(cy(c) - cy(last[0])) < tol) last.push(c);
    else rows.push([c]);
  });
  const ordered = [];
  rows.forEach(r => { r.sort((a, b) => cxx(a) - cxx(b)); r.forEach(c => ordered.push(c)); });

  const SZ = 132, pad = 10;
  Object.keys(APPS).forEach(key => {
    const c = ordered[Math.min(APPS[key].cell, ordered.length - 1)];
    if (!c) return;
    const x0 = c[0] / k, y0 = c[1] / k, x1 = (c[2] + 1) / k, y1 = (c[3] + 1) / k;
    const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
    const o = document.createElement('canvas');
    o.width = SZ; o.height = SZ;
    const oc = o.getContext('2d');
    oc.fillStyle = '#fff'; oc.fillRect(0, 0, SZ, SZ);
    const sc = Math.min((SZ - pad*2) / w, (SZ - pad*2) / h);
    const dw = w * sc, dh = h * sc;
    oc.drawImage(img, x0, y0, w, h, (SZ - dw)/2, (SZ - dh)/2, dw, dh);
    ICON[key] = o.toDataURL('image/png');
  });
  applyIcons();
}

renderHome();

/* ---------- 长按整理（跟手 + 让位动画） ---------- */
let EDIT = false, holdEl = null, lpTimer = null, sx = 0, sy = 0, moved = false, swallow = false;
let ghost = null, dragStart = null, rafId = 0, lastPt = null;

function flip(container, mutate){
  const before = new Map();
  [...container.children].forEach(el => before.set(el, el.getBoundingClientRect()));
  mutate();
  [...container.children].forEach(el => {
    const a = before.get(el); if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px,${dy}px)`;
    el.getBoundingClientRect();
    el.style.transition = 'transform .32s cubic-bezier(.2,.85,.25,1)';
    el.style.transform = '';
  });
}

function enterEdit(){ EDIT = true; document.body.classList.add('edit'); }
function exitEdit(){
  EDIT = false;
  document.body.classList.remove('edit','dragging');
  GRID = [...$('grid').children].map(e => e.dataset.k);
  DOCK = [...$('dock').children].map(e => e.dataset.k);
  localStorage.setItem('xm_grid', JSON.stringify(GRID));
  localStorage.setItem('xm_dock', JSON.stringify(DOCK));
}
function resetLayout(){
  GRID = [...DEFAULT_GRID]; DOCK = [...DEFAULT_DOCK];
  localStorage.setItem('xm_grid', JSON.stringify(GRID));
  localStorage.setItem('xm_dock', JSON.stringify(DOCK));
  renderHome();
  if ($('stTest')) $('stTest').textContent = '桌面顺序已还原。';
}

function beginDrag(t){
  const r = holdEl.getBoundingClientRect();
  ghost = holdEl.cloneNode(true);
  ghost.className = 'tile ghost';
  ghost.style.transition = 'none';
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  ghost.style.width = r.width + 'px';
  document.body.appendChild(ghost);
  holdEl.classList.add('placeholder');
  document.body.classList.add('dragging');
  dragStart = { x: t.clientX, y: t.clientY };
}
function endDrag(){
  if (ghost){ ghost.remove(); ghost = null; }
  if (holdEl) holdEl.classList.remove('placeholder');
  document.body.classList.remove('dragging');
  dragStart = null; lastPt = null;
  if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
}

function moveGhost(){
  rafId = 0;
  if (!ghost || !lastPt || !dragStart) return;
  const t = lastPt;
  ghost.style.transform = `translate3d(${t.clientX - dragStart.x}px,${t.clientY - dragStart.y}px,0)`;
  const under = document.elementFromPoint(t.clientX, t.clientY);
  const target = under && under.closest ? under.closest('.tile') : null;
  if (target && target !== holdEl && !target.classList.contains('ghost')
      && target.parentNode === holdEl.parentNode){
    const kids = [...holdEl.parentNode.children];
    const a = kids.indexOf(holdEl), b = kids.indexOf(target);
    if (a !== -1 && b !== -1 && a !== b){
      flip(holdEl.parentNode, () => {
        if (b > a) holdEl.parentNode.insertBefore(holdEl, target.nextSibling);
        else holdEl.parentNode.insertBefore(holdEl, target);
      });
    }
  }
}

document.addEventListener('touchstart', e => {
  const el = e.target.closest('.tile'); if (!el) return;
  holdEl = el; sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
  clearTimeout(lpTimer);
  if (EDIT) return;
  lpTimer = setTimeout(() => { if (!EDIT) enterEdit(); }, 450);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!holdEl) return;
  const t = e.touches[0];
  if (!EDIT){
    if (Math.hypot(t.clientX - sx, t.clientY - sy) > 12){ clearTimeout(lpTimer); holdEl = null; }
    return;
  }
  e.preventDefault();
  if (!ghost) beginDrag(t);
  moved = true;
  lastPt = { clientX: t.clientX, clientY: t.clientY };
  if (!rafId) rafId = requestAnimationFrame(moveGhost);
}, { passive: false });

document.addEventListener('touchend', () => {
  clearTimeout(lpTimer);
  endDrag();
  if (moved){ swallow = true; setTimeout(() => swallow = false, 350); }
  if (!EDIT) holdEl = null;
}, { passive: true });

/* 开 https 链接：新开一页，不弹「在 App 中打开」 */
function goOut(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
/* 只有 scheme 才唤得起的 App：两次机会，1.5 秒没跳走才退回 */
function openNative(schemes, fallback){
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener('visibilitychange', onHide);
  const go = s => {
    const a = document.createElement('a');
    a.href = s; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => a.remove(), 60);
  };
  go(schemes[0]);
  if (schemes[1]) setTimeout(() => { if (!left && !document.hidden) go(schemes[1]); }, 220);
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if (!left && !document.hidden && fallback) window.location.href = fallback;
  }, 1500);
}

document.addEventListener('click', e => {
  const el = e.target.closest('.tile'); if (!el) return;
  if (EDIT || swallow) return;
  const app = APPS[el.dataset.k]; if (!app) return;
  if (app.href) goOut(app.href);
  else if (app.schemes) openNative(app.schemes, app.fallback);
  else openApp(el.dataset.k);
});

/* ---------- 打开 / 关闭 ---------- */
function openApp(k){
  const app = APPS[k]; if (!app) return;
  const body = $('ovbody');
  body.className = app.full ? 'ovchat' : '';
  $('ovTitle').textContent = app.n;
  body.innerHTML = app.v();
  $('ov').classList.remove('hide');
  if (k === 'chat') renderChat(true);
  if (k === 'game') newGame();
  if (k === 'breathe') startBreathe();
}
function closeOv(){
  stopBreathe();
  $('ov').classList.add('hide');
  $('ovbody').innerHTML = '';
  $('ovbody').className = '';
}

function addPhoto(inp){
  const files = [...inp.files].slice(0, 9);
  if (!files.length) return;
  files.forEach(f => {
    const r = new FileReader();
    r.onload = e => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'), s = Math.min(1, 900/Math.max(im.width,im.height));
        c.width = im.width*s; c.height = im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        S.photos = (S.photos||[]).concat([c.toDataURL('image/jpeg',.78)]).slice(-9);
        save(); openApp('album');
      };
      im.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
}
function delPhoto(i){ S.photos.splice(i,1); save(); openApp('album'); }

let G = {ans:0, tries:0};
function newGame(){
  G.ans = Math.floor(Math.random()*100)+1; G.tries = 0;
  if ($('gOut')) $('gOut').textContent = '1 到 100，猜一个。';
  if ($('gIn')) $('gIn').value = '';
}
function gGuess(){
  const v = +$('gIn').value; if (!v) return;
  G.tries++;
  if (v === G.ans){ $('gOut').textContent = `对了，${G.tries} 次。你比我想的准。`; $('gIn').value=''; return; }
  $('gOut').textContent = v < G.ans ? '小了，往上。' : '大了，往下。';
  $('gIn').value = '';
}

  S.name = $('sName').value || '小咩';
  S.anniv = $('sAnniv').value || S.anniv;
  S.relay = $('sRelay').value.trim() || S.relay;
  S.key = $('sKey').value.trim();
  S.inbox = $('sInbox').value.trim() || 'xiaomie';
  S.apiUrl = $('sApiUrl').value.trim();
  S.apiKey = $('sApiKey').value.trim();
  S.model = $('sModel').value.trim();
  S.apiType = $('sType').value.trim() || 'openai';
  S.wall = $('sWall').value.trim();
  S.icon = $('sIcon').value.trim();

}
