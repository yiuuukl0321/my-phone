  let text = texts.join('\n');

  const m = text.match(/<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>/i);
  if (m){ thinks.push(m[1]); text = text.replace(m[0], ''); }

  const keep = [];
  text.split('\n').forEach(line => {
    let mm = line.match(/^\s*[\[【]\s*记\s*[\]】]\s*(.+?)\s*$/);
    if (mm && mm[1]){ mems.push(mm[1]); return; }
    mm = line.match(/^\s*[\[【]{1,2}\s*闹钟\s*[\]】]{1,2}\s*(\d{1,2})\s*[:：]\s*(\d{2})\s*[|｜]?\s*(.*)$/);
    if (mm){
      const hh = Math.min(23, Math.max(0, +mm[1]));
      const mi = Math.min(59, Math.max(0, +mm[2]));
      alarms.push({ hh, mm: mi, label: (mm[3] || '').trim() });
      return;
    }
    keep.push(line);
  });
  text = keep.join('\n')
    .replace(/[\[【]{1,2}\s*记\s*[\]】]{1,2}[^\n]*/g, '')
    .replace(/[\[【]{1,2}\s*闹钟\s*[\]】]{1,2}[^\n]*/g, '')
    .trim();

  return { text, think: thinks.join('\n').trim(), mems, alarms };
}

function estTokens(s){
  const t = String(s || '');
  let cjk = 0, other = 0;
  for (const ch of t){
    if (/[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff00-\uffef]/.test(ch)) cjk++;
    else other++;
  }
  return Math.round(cjk + other / 4);
}
function pickTokens(item){
  const u = item && (item.usage || item.tokens_used || {});
  const n = (u && (u.total_tokens || u.totalTokens)) || (item && item.tokens) || 0;
  return n > 0 ? Math.round(n) : 0;
}

/* ---------- 闹钟 ---------- */
let audioCtx = null, beepTimer = null;
function beepOn(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const once = () => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    };
    once();
    clearInterval(beepTimer);
    beepTimer = setInterval(once, 900);
  } catch(e){}
}
function beepOff(){ clearInterval(beepTimer); beepTimer = null; }

function addAlarmLocal(hh, mm, label){
  ALARMS.push({ id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,4),
                hh, mm, label: label || '', on: 1, last: '' });
  saveAlarms();
}
function pushAlarmsToCloud(list){
  if (!list.length) return;
  const now = new Date();
  const rows = list.map(a => {
    const d = new Date(now.getTime());
    d.setHours(a.hh, a.mm, 0, 0);
    if (d <= now) d.setDate(d.getDate() + 1);
    const iso = d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate())
      + 'T' + p2(a.hh) + ':' + p2(a.mm) + ':00+08:00';
    return { at: iso, at_time: p2(a.hh) + ':' + p2(a.mm), label: a.label || '闹钟' };
  });
  fetch(SB_URL, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
               'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(rows)
  }).catch(() => {});
}

    : '<div class="empty">还没设闹钟。在聊天里跟他说「七点叫我」也行。</div>';
  return `<div class="card"><div class="eyebrow">ALARM</div>${list}</div>
  <div class="card">
    <div class="field"><span>时间</span><input id="aTime" type="time" value="07:00"></div>
    <div class="field"><span>备注</span><input id="aLabel" placeholder="起床" maxlength="12"></div>
    <div class="item" onclick="addAlarm()"><span>加一个</span><em>›</em></div>

  </div>
  <div class="card"><div class="sub" style="margin:0">在聊天里提到要几点起，我会自动给你加进来。
    同时会往手机时钟那边递一条 —— 那边要等你把「闹钟同步」那条捷径弄好才会真的建出来。
    这个 app 里的闹钟只在开着咩&amp;砚的时候会响。</div></div>`;
}
function tglAlarm(id){
  const a = ALARMS.find(x => x.id === id); if (!a) return;
  a.on = a.on ? 0 : 1; saveAlarms(); drawerGo('alarm');

function delAlarm(id){

function checkAlarms(){
  const d = new Date();
  const key = d.toDateString() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  ALARMS.forEach(a => {
    if (!a.on) return;
    if (a.hh !== d.getHours() || a.mm !== d.getMinutes()) return;
    if (a.last === key) return;
    a.last = key; saveAlarms();
    ringAlarm(a);
  });
}

async function sendChat(){
  if (isBlocked()) return;
  const inp = $('mIn'), text = inp.value.trim();
  if (!text) return;
  if (!S.key || !S.apiUrl || !S.apiKey || !S.model){ alert('先去「设置」把参数填好'); return; }
  if (recog){ try { recog.stop(); } catch(e){} recog = null; setMicUI(false); }
  inp.value = '';
  SENDING = true;
  CHAT.push({ role: 'user', text, t: Date.now() });
  CHAT.push({ role: 'assistant', text: '', typing: true });
  saveChat(); renderChat(true);

  const t0 = Date.now();
  const rid = 'r' + t0 + Math.random().toString(36).slice(2,7);
  try {
    await api('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requestId: rid, inboxId: S.inbox,
        messages: buildMessages(),
        settings: {
          mainApiUrl: S.apiUrl, mainApiKey: S.apiKey, mainApiModel: S.model,
          apiType: S.apiType || 'openai', temperature: 0.9
        },
        meta: { charName: '祁砚', charId: 'kai' }
      })
    });
  } catch(e){
    SENDING = false;
    CHAT.pop();
    CHAT.push({ role: 'assistant', text: '发不出去：' + e.message, t: Date.now() });
    saveChat(); renderChat(true); return;
  }

  let hit = null;
  for (let i = 0; i < 24; i++){
    await sleep(i ? 2000 : 400);
    try {
      const j = await api('/outbox?inboxId=' + encodeURIComponent(S.inbox) + '&since=0');
      const f = (j.items || []).find(x => String(x.requestId) === String(rid));
      if (f){
        await api('/ack', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inboxId: S.inbox, ids: [f.id] })
        }).catch(() => {});
        hit = f;
        break;
      }
    } catch(e){}
  }
  const ms = Date.now() - t0;

  let msg;
  if (!hit){
    msg = { role: 'assistant', text: '没等到回复，再发一次试试。', t: Date.now(), ms };
  } else if (hit.error){
    msg = { role: 'assistant', text: '出错了：' + hit.error, t: Date.now(), ms };
  } else {
    const r = parseReply(hit.content);
    const tok = pickTokens(hit) || estTokens(hit.content);
    msg = { role: 'assistant', text: r.text || '（空）', t: Date.now(),
            think: r.think, ms, tok };
    if (S.autoMem){
      const saved = [];
      r.mems.forEach(m => { if (addMemAuto(m)) saved.push(m); });
      msg._saved = saved;
    }
    if (r.alarms.length){
      r.alarms.forEach(a => addAlarmLocal(a.hh, a.mm, a.label));
      pushAlarmsToCloud(r.alarms);
      msg._alarms = r.alarms;
    }
  }

  SENDING = false;
  CHAT.pop();
  CHAT.push(msg);
  saveChat(); renderChat(true);
  if (msg._saved && msg._saved.length) flashMemo(msg._saved.join(' · '));
  if (msg._alarms && msg._alarms.length) flashAlarm(msg._alarms);
}

async function pullOutbox(){
  if (SENDING || !S.key || !S.relay) return;
  try {
    const j = await api('/outbox?inboxId=' + encodeURIComponent(S.inbox) + '&since=0');
    const items = (j.items || []).filter(x => x.content || x.error);
    if (!items.length) return;
    const saved = [], alarms = [];
    items.forEach(it => {
      if (it.error){
        CHAT.push({ role: 'assistant', text: '出错了：' + it.error, t: Date.now() });
        return;
      }
      const r = parseReply(it.content);
      const tok = pickTokens(it) || estTokens(it.content);
      CHAT.push({ role: 'assistant', text: r.text || '（空）', think: r.think, tok, t: Date.now() });
      if (S.autoMem) r.mems.forEach(m => { if (addMemAuto(m)) saved.push(m); });
      r.alarms.forEach(a => { addAlarmLocal(a.hh, a.mm, a.label); alarms.push(a); });
    });
    if (alarms.length) pushAlarmsToCloud(alarms);
    await api('/ack', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inboxId: S.inbox, ids: items.map(x => x.id) })
    }).catch(() => {});
    saveChat();
    if ($('msgs')){
      renderChat(true);
      if (saved.length) flashMemo(saved.join(' · '));
      if (alarms.length) flashAlarm(alarms);
    }
  } catch(e){}
}

/* ---------- 右滑返回 ---------- */
function attachSwipeBack(el, closeFn){
  let startX = 0, startY = 0, dx = 0, live = false;
  el.addEventListener('touchstart', e => {
    if (el.classList.contains('hide')) return;
    const t = e.touches[0];
    if (t.clientX > 48) return;
    live = true; startX = t.clientX; startY = t.clientY; dx = 0;
    el.style.transition = 'none';
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!live) return;
    const t = e.touches[0];
    const mx = t.clientX - startX, my = t.clientY - startY;
    if (my > 30 && Math.abs(my) > Math.abs(mx)){ live = false; el.style.transition=''; el.style.transform=''; return; }
    dx = Math.max(0, mx);
    e.preventDefault();
    el.style.transform = `translateX(${dx}px)`;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (!live) return;
    live = false;
    if (dx > 80){
      el.style.transition = 'transform .22s ease-out';
      el.style.transform = 'translateX(100%)';
      setTimeout(() => {
        closeFn();
        el.style.transition = 'none';
        el.style.transform = '';
        requestAnimationFrame(() => { el.style.transition = ''; });
      }, 220);
    } else {
      el.style.transition = '';
      el.style.transform = '';
    }
    dx = 0;
  }, { passive: true });
}

/* ---------- 推送 ---------- */
function urlB64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window); }

async function refreshPushState(){
  const el = $('pushState'); if (!el) return;
  try {
    if (!('serviceWorker' in navigator)){ el.textContent = '不支持'; return; }
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    el.textContent = sub ? '已开启' : '未开启';
  } catch(e){ el.textContent = '未开启'; }
}
async function enablePush(){
  const out = $('pushMsg');
  out.textContent = '';
  try {
    if (!pushSupported()){
      out.textContent = '这个浏览器不支持推送。\niPhone 要先「添加到主屏幕」，再从主屏幕那个图标打开，才给推送。';
      return;
    }
    if (!S.key){ out.textContent = '先去下面把中继密钥填好。'; return; }
    if (!('Notification' in window)){ out.textContent = '没有 Notification 接口。'; return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){
      out.textContent = '权限没给。去 iPhone「设置 → 通知 → 咩&砚」里打开通知。';
      return;
    }
    out.textContent = '注册中…';
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const kr = await api('/api/push/vapid-key');
    const pub = typeof kr === 'string' ? kr
      : (kr && (kr.publicKey || kr.key || kr.vapidPublicKey || kr.pub));
    if (!pub || typeof pub !== 'string'){
      out.textContent = '中继没给 VAPID 公钥：' + JSON.stringify(kr).slice(0, 160);
      return;
    }
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(pub)
      });
    }
    const json = sub.toJSON();
    await api('/api/push/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        inboxId: S.inbox,
        channel: 'web',
        sub: json,
        subscription: { channel: 'web', sub: json }
      })
    });
    S.pushOn = 1; save();
    out.textContent = '推送开好了。';
    refreshPushState();
  } catch(e){
    out.textContent = '失败：' + e.message;
  }
}
async function disablePush(){
  const out = $('pushMsg');
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub){
      await api('/api/push/unsubscribe', {
        method: 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ inboxId: S.inbox, endpoint: sub.endpoint })
      }).catch(() => {});
      await sub.unsubscribe();
    }
    S.pushOn = 0; save();
    out.textContent = '推送关掉了。';
    refreshPushState();
  } catch(e){ out.textContent = '失败：' + e.message; }
}

/* ---------- 自动认图裁图标 ---------- */
const ICON = {};
const SPRITE = 'IMG_6462.jpeg';

function splitBands(arr, minGap, minSize){
  const out = []; let s = -1, g = 0;
  for (let i = 0; i < arr.length; i++){
    if (arr[i] > 0){ if (s < 0) s = i; g = 0; }
    else if (s >= 0){ g++; if (g >= minGap){ out.push([s, i - g]); s = -1; g = 0; } }
  }
  if (s >= 0) out.push([s, arr.length - 1]);
  return out.filter(b => b[1] - b[0] >= minSize);
}

async function buildIcons(){
  const img = new Image();
  img.src = SPRITE;
  try { await img.decode(); }
  catch(e){ await new Promise(r => { img.onload = r; img.onerror = r; }); }
  const NW = img.naturalWidth, NH = img.naturalHeight;
  if (!NW || !NH) return;

  const AW = 700, k = AW / NW, AH = Math.max(1, Math.round(NH * k));
  const cv = document.createElement('canvas');
  cv.width = AW; cv.height = AH;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, AW, AH);
  cx.drawImage(img, 0, 0, AW, AH);
  let px;
  try { px = cx.getImageData(0, 0, AW, AH).data; } catch(e){ return; }

  const ink = new Uint8Array(AW * AH);
  for (let i = 0, j = 0; i < px.length; i += 4, j++){
    ink[j] = (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114) < 200 ? 1 : 0;
  }
  const colSum = new Int32Array(AW);
  for (let x = 0; x < AW; x++){
    let s = 0;
    for (let y = 0; y < AH; y++) s += ink[y*AW + x];
    colSum[x] = s;
  }
  const cols = splitBands(colSum, 10, Math.round(AW * 0.02));
  const cells = [];
  cols.forEach(cb => {
    const rowSum = new Int32Array(AH);
    for (let y = 0; y < AH; y++){
      let s = 0;
      for (let x = cb[0]; x <= cb[1]; x++) s += ink[y*AW + x];
      rowSum[y] = s;
    }
    splitBands(rowSum, 10, Math.round(AH * 0.02)).forEach(rb => cells.push([cb[0], rb[0], cb[1], rb[1]]));
  });
  if (!cells.length) return;

  const cy = c => (c[1] + c[3]) / 2, cxx = c => (c[0] + c[2]) / 2;
  cells.sort((a, b) => cy(a) - cy(b));
  const rows = [], tol = AH * 0.07;
  cells.forEach(c => {
    const last = rows[rows.length - 1];
    if (last && Math.abs(cy(c) - cy(last[0])) < tol) last.push(c);
    else rows.push([c]);
  });
  const ordered = [];
  rows.forEach(r => { r.sort((a, b) => cxx(a) - cxx(b)); r.forEach(c => ordered.push(c)); });

  const SZ = 132, pad = 10;
  Object.keys(APPS).forEach(key => {
    const c = ordered[Math.min(APPS[key].cell, ordered.length - 1)];
    if (!c) return;
    const x0 = c[0] / k, y0 = c[1] / k, x1 = (c[2] + 1) / k, y1 = (c[3] + 1) / k;
    const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
    const o = document.createElement('canvas');
    o.width = SZ; o.height = SZ;
    const oc = o.getContext('2d');
    oc.fillStyle = '#fff'; oc.fillRect(0, 0, SZ, SZ);
    const sc = Math.min((SZ - pad*2) / w, (SZ - pad*2) / h);
    const dw = w * sc, dh = h * sc;
    oc.drawImage(img, x0, y0, w, h, (SZ - dw)/2, (SZ - dh)/2, dw, dh);
    ICON[key] = o.toDataURL('image/png');
  });
  applyIcons();
}

/* ---------- 长按整理 ---------- */
function flip(container, mutate){
  const before = new Map();
  [...container.children].forEach(el => before.set(el, el.getBoundingClientRect()));
  mutate();
  [...container.children].forEach(el => {
    const a = before.get(el); if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px,${dy}px)`;
    el.getBoundingClientRect();
    el.style.transition = 'transform .3s cubic-bezier(.2,.85,.25,1)';
    el.style.transform = '';
  });
}

function beginDrag(t){
  const r = holdEl.getBoundingClientRect();
  ghost = holdEl.cloneNode(true);
  ghost.className = 'tile ghost';
  ghost.style.transition = 'none';
  ghost.style.left = r.left + 'px';
  ghost.style.top = r.top + 'px';
  ghost.style.width = r.width + 'px';
  document.body.appendChild(ghost);
  holdEl.classList.add('placeholder');
  document.body.classList.add('dragging');
  dragStart = { x: t.clientX, y: t.clientY };
  lastSwap = 0;
}
function endDrag(){
  if (ghost){ ghost.remove(); ghost = null; }
  if (holdEl) holdEl.classList.remove('placeholder');
  document.body.classList.remove('dragging');
  dragStart = null; lastPt = null;
  if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
}

function moveGhost(){
  rafId = 0;
  if (!ghost || !lastPt || !dragStart) return;
  const t = lastPt;
  ghost.style.transform = `translate3d(${t.clientX - dragStart.x}px,${t.clientY - dragStart.y}px,0)`;

  const now = Date.now();
  if (now - lastSwap < 170) return;

  const under = document.elementFromPoint(t.clientX, t.clientY);
  if (!under || !under.closest) return;

  const cont = under.closest('#grid') || under.closest('#dock');
  if (!cont) return;
  const cur = holdEl.parentNode;

  const tile = under.closest('.tile');
  const validTile = tile && tile !== holdEl && !tile.classList.contains('restore');

  if (validTile){
    lastSwap = now;
    if (tile.parentNode === cur){
      const kids = [...cur.children];
      const a = kids.indexOf(holdEl), b = kids.indexOf(tile);
      if (a === -1 || b === -1 || a === b) return;
      flip(cur, () => {
        if (b > a) cur.insertBefore(holdEl, tile.nextSibling);
        else cur.insertBefore(holdEl, tile);
      });
    } else {
      flip(tile.parentNode, () => {
        const r = tile.getBoundingClientRect();
        const after = t.clientX > r.left + r.width / 2;
        tile.parentNode.insertBefore(holdEl, after ? tile.nextSibling : tile);
      });
    }
    return;
  }

  if (cont !== cur){
    lastSwap = now;
    flip(cont, () => {
      const kids = [...cont.children].filter(el => el !== holdEl);
      let ref = null;
      for (const el of kids){
        const r = el.getBoundingClientRect();
        if (t.clientX < r.left + r.width / 2){ ref = el; break; }
      }
      if (ref) cont.insertBefore(holdEl, ref);
      else cont.appendChild(holdEl);
    });
  }
}

document.addEventListener('touchstart', e => {
  const el = e.target.closest('.tile'); if (!el) return;
  holdEl = el; sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
  clearTimeout(lpTimer);
  if (EDIT) return;
  lpTimer = setTimeout(() => { if (!EDIT) enterEdit(); }, 450);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!holdEl) return;
  const t = e.touches[0];
  if (!EDIT){
    if (Math.hypot(t.clientX - sx, t.clientY - sy) > 12){ clearTimeout(lpTimer); holdEl = null; }
    return;
  }
  e.preventDefault();
  if (!ghost) beginDrag(t);
  moved = true;
  lastPt = { clientX: t.clientX, clientY: t.clientY };
  if (!rafId) rafId = requestAnimationFrame(moveGhost);
}, { passive: false });

document.addEventListener('touchend', () => {
  clearTimeout(lpTimer);
  endDrag();
  if (moved){ swallow = true; setTimeout(() => swallow = false, 350); }
  if (!EDIT) holdEl = null;
}, { passive: true });

function goOut(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if (del && EDIT){
    const t = del.parentNode;
    if (t && t.dataset.k) removeApp(t.dataset.k);
    return;
  }
  const el = e.target.closest('.tile'); if (!el) return;
  if (el.classList.contains('restore')){ if (EDIT) restoreApp(el.dataset.k); return; }
  if (EDIT || swallow) return;
  const app = APPS[el.dataset.k]; if (!app) return;
  if (app.href) goOut(app.href);
  else openApp(el.dataset.k);
});

  $('shbody').innerHTML = `<div class="card">
    <div class="eyebrow">找到 ${hits.length} 条 · 点一下跳过去</div>

function isBlocked(){ return S.blockUntil && S.blockUntil > Date.now(); }
function refreshBlockUI(){
  const left = Math.max(0, Math.ceil(((S.blockUntil || 0) - Date.now()) / 1000));
  const on = left > 0;
  const bar = $('blockBar');
  const inp = $('mIn');
  const btn = document.querySelector('.inputbar button:last-child');
  if (bar){
    bar.style.display = on ? 'block' : 'none';
    bar.textContent = on ? `已被拉黑 · ${left} 秒后自动解除` : '';
  }
  if (inp){ inp.disabled = on; inp.placeholder = on ? '已被拉黑' : '说点什么'; }
  if (btn) btn.disabled = on;
}
function startBlockWatch(){
  clearInterval(blockTimer);
  blockTimer = setInterval(() => {
    if (!isBlocked()){
      clearInterval(blockTimer);
      refreshBlockUI();
      if (S.blockUntil) unblock();
      return;
    }
    refreshBlockUI();
  }, 500);
}
function blockKai(){
  S.blockUntil = Date.now() + 30000;
  save();
  closeSheet();
  refreshBlockUI();
  startBlockWatch();
}
function unblock(){
  S.blockUntil = 0; save();

/* ---------- 天气 ---------- */
function vWeather(){
  return `<div class="card">
    <div class="eyebrow">WEATHER</div>
    <div class="big" id="wOut">正在定位…</div>
    <div class="sub" id="wSub"></div>
  </div>
  <div class="card"><div class="item" onclick="loadWeather()"><span>刷新</span><em>›</em></div></div>`;
}
function wText(code){
  const m = {0:'晴',1:'大致晴',2:'多云',3:'阴',45:'雾',48:'雾凇',51:'毛毛雨',53:'小雨',55:'中雨',
    56:'冻毛毛雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',
    71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',
    85:'阵雪',86:'强阵雪',95:'雷阵雨',96:'雷阵雨带冰雹',99:'强雷暴'};
  return m[code] || ('天气码 ' + code);
}
async function loadWeather(){
  const o = $('wOut'), s = $('wSub'); if (!o) return;
  o.textContent = '正在定位…'; s.textContent = '';
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, maximumAge: 600000 }));
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    const r = await fetch('https://api.open-meteo.com/v1/forecast'
      + `?latitude=${la}&longitude=${lo}`
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
      + '&timezone=Asia%2FHong_Kong&forecast_days=1');
    const j = await r.json();
    const c = j.current, d = j.daily;
    o.textContent = `${Math.round(c.temperature_2m)}° · ${wText(c.weather_code)}`;
    s.textContent = `体感 ${Math.round(c.apparent_temperature)}° · 湿度 ${c.relative_humidity_2m}%\n`
      + `今天 ${Math.round(d.temperature_2m_min[0])}° ~ ${Math.round(d.temperature_2m_max[0])}°`
      + ` · 降雨概率 ${d.precipitation_probability_max[0]}%`;
  } catch(e){
    o.textContent = '拿不到天气';
    s.textContent = '定位或网络被挡了：' + e.message;
  }
}

function vBreathe(){

function startBreathe(){
  let inhale = true;
  const set = () => { const t = $('bText'); if (t) t.textContent = inhale ? '吸气' : '呼气'; };
  set();
  bTimer = setInterval(() => { inhale = !inhale; set(); }, 4000);
}
function stopBreathe(){ clearInterval(bTimer); bTimer = null; }

let G = {ans:0, tries:0};
function vGame(){
  return `<div class="card">
    <div class="eyebrow">GUESS</div>
    <div class="big" id="gOut">1 到 100，猜一个。</div>
    <div class="field" style="margin-top:14px"><span>你的答案</span>
      <input id="gIn" type="number" inputmode="numeric" placeholder="——"></div>
  </div>
  <div class="card">
    <div class="item" onclick="gGuess()"><span>猜</span><em>›</em></div>
    <div class="item" onclick="newGame()"><span>重来</span><em>›</em></div>
  </div>`;
}
function newGame(){
  G.ans = Math.floor(Math.random()*100)+1; G.tries = 0;
  if ($('gOut')) $('gOut').textContent = '1 到 100，猜一个。';
  if ($('gIn')) $('gIn').value = '';
}
function gGuess(){
  const v = +$('gIn').value; if (!v) return;
  G.tries++;
  if (v === G.ans){ $('gOut').textContent = `对了，${G.tries} 次。你比我想的准。`; $('gIn').value=''; return; }
  $('gOut').textContent = v < G.ans ? '小了，往上。' : '大了，往下。';
  $('gIn').value = '';
}

function toggleAuto(){ S.autoMem = S.autoMem ? 0 : 1; save(); openApp('set'); }
function addMem(){
  const t = $('mNew').value.trim();
  if (!t) return;
  if (!addMemAuto(t)) return;
  openApp('set');
}
function delMemText(el){
  const t = el.previousElementSibling.textContent;
  const i = MEM.indexOf(t);
  if (i > -1){ MEM.splice(i,1); saveMem(); }
  openApp('set');
}
function clearMem(){
  if (!confirm('把记住的事全部清掉？')) return;
  MEM = []; saveMem(); openApp('set');
}

function addPhoto(inp){
  const files = [...inp.files].slice(0, 9);
  if (!files.length) return;
  files.forEach(f => {
    const r = new FileReader();
    r.onload = e => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'), s = Math.min(1, 900/Math.max(im.width,im.height));
        c.width = im.width*s; c.height = im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        S.photos = (S.photos||[]).concat([c.toDataURL('image/jpeg',.78)]).slice(-9);
        save(); openApp('album');
      };
      im.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
}
function delPhoto(i){ S.photos.splice(i,1); save(); openApp('album'); }

<div id="wall"></div>
<div id="dbg" style="position:fixed;left:0;bottom:0;z-index:99999;background:#000;color:#0f0;
font:11px/1.3 monospace;padding:3px 5px"></div>
<script>

(function(){
  var st = document.createElement('style');
  st.textContent = 'html{overflow:hidden;background-color:#eceae5;background-repeat:no-repeat;background-position:center top;background-size:cover}body{height:100%;overflow:hidden;background:transparent}';
  document.head.appendChild(st);
  var old = document.getElementById('wall');
  if (old) old.style.display = 'none';
  function tall(){ return Math.max(innerHeight, screen.height, document.documentElement.clientHeight); }
  function paint(){
    var w = S.wall || WALL_DEFAULT, dim = Math.max(0, Math.min(.6, +S.dim || 0));
    var de = document.documentElement;
    de.style.setProperty('height', tall() + 'px', 'important');
    de.style.setProperty('background-image',
      'linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,0) 130px),' +
      'linear-gradient(rgba(0,0,0,' + dim + '),rgba(0,0,0,' + dim + ')),' +
      "url('" + w + "')", 'important');
  }
  window.applyWall = paint;
  paint();
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;background:#000;color:#0f0;font:11px/1.3 monospace;padding:3px 5px';
  document.body.appendChild(d);
  function up(){
    var v = window.visualViewport || {};
    d.textContent = 'ih=' + innerHeight + ' vv=' + Math.round(v.height || 0) +
      ' doc=' + document.documentElement.clientHeight + ' scr=' + screen.height +
      ' set=' + document.documentElement.style.height;
  }
  up();
  addEventListener('resize', function(){ paint(); up(); });
  addEventListener('orientationchange', function(){ paint(); up(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', up);
})();
</script>
