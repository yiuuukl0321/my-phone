name: 整理代码

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 跑整理脚本
        run: python tidy.py

      - name: 提交回去
        run: |
          rm -rf _backup_原始 整理报告.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
          else
            git commit -m "整理代码：标题统一 + 函数间两行 + 删废块"
            git push
          fi
